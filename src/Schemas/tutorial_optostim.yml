%YAML 1.1
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/neurogears/BonFly/main/src/Schemas/StimuliSpecification.json

trials:
  [
    &optoTrial {
      optogeneticsContinuousStimuli: {amplitude: 3, duration: 2, delayOnset: 15, ledTarget: Led1}
    }, 
    &optoTrial {
      optogeneticsContinuousStimuli: {amplitude: 3, duration: 2, delayOnset: 5, ledTarget: Led0}
    },      
    &optoTrial {
      optogeneticsPulsedStimuli: {amplitude: 3, duration: 3, frequency: 2, dutyCycle: 50, delayOnset: 10, ledTarget: Led1}
    },
    &optoTrial {
      optogeneticsPulsedStimuli: {amplitude: 3, duration: 3, frequency: 2, dutyCycle: 50, delayOnset: 10, ledTarget: Led0}
    },
    &optoTrial {
      optogeneticsRampedStimuli: {amplitude: 10, durationSteady: 3, durationRamp: 1.0, delayOnset: 5, ledTarget: Led1}
    },    
    &optoTrial {
      optogeneticsRampedStimuli: {amplitude: 10, durationSteady: 3, durationRamp: 1.0, delayOnset: 5, ledTarget: Led0}
    }
  ]
